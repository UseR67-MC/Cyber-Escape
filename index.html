<!DOCTYPE html>
<html>
<head>
  <title>Cyber Escape</title>
  <style>
    body{
      background:black;
      color:lime;
      font-family:monospace;
      text-align:center;
      margin-top:100px;
    }

    input{
      padding:10px;
      background:#111;
      color:lime;
      border:1px solid lime;
    }

    button{
      padding:10px;
      background:lime;
      border:none;
      cursor:pointer;
    }
  </style>
</head>

<body>

<h1>CYBER ESCAPE</h1>

<p>Find the password to continue.</p>

<!-- password = shadow -->

<input type="password" id="pw">
<button onclick="check()">ENTER</button>

<script>
function check(){
  let pw = document.getElementById("pw").value;

  if(pw === "shadow"){
    alert("ACCESS GRANTED");
  } else {
    alert("ACCESS DENIED");
  }
}
</script>

</body>
